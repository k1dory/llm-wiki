<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Wiki</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6' fill='%234f9cf9'/><circle cx='6' cy='7' r='3' fill='%238b93a7'/><circle cx='26' cy='24' r='3' fill='%238b93a7'/></svg>">
</head>
<body>
<header>
  <div class="brand">LLM&nbsp;Wiki</div>
  <input id="search" type="search" placeholder="Поиск… (/)" autocomplete="off">
  <div class="spacer"></div>
  <span id="stats" class="stats"></span>
  <button id="new-page" class="btn">+ Страница</button>
</header>

<main>
  <aside id="sidebar">
    <div class="tabs">
      <button class="tab active" data-tab="pages">Страницы</button>
      <button class="tab" data-tab="tags">Теги</button>
    </div>
    <ul id="page-list" class="list"></ul>
    <ul id="tag-list" class="list hidden"></ul>
  </aside>

  <section id="viewer">
    <div id="view-mode">
      <div class="page-head">
        <h1 id="page-title">Выберите страницу</h1>
        <div class="page-actions">
          <button id="edit" class="btn hidden">Править</button>
          <button id="delete" class="btn danger hidden">Удалить</button>
        </div>
      </div>
      <div id="page-tags" class="tags"></div>
      <article id="page-content" class="content">
        <p class="muted">Слева — список страниц, справа — граф связей.
        Ссылки внутри текста пишутся как <code>[[имя-страницы]]</code>.</p>
      </article>
      <div id="page-links" class="links"></div>
    </div>

    <div id="edit-mode" class="hidden">
      <input id="edit-slug" class="field" placeholder="slug (латиница/кириллица, без пробелов)">
      <input id="edit-title" class="field" placeholder="Заголовок">
      <input id="edit-tags" class="field" placeholder="теги, через запятую">
      <textarea id="edit-content" class="field mono" placeholder="Markdown. Ссылка на другую страницу: [[slug]] или [[slug|подпись]]"></textarea>
      <div class="page-actions">
        <button id="save" class="btn primary">Сохранить</button>
        <button id="cancel" class="btn">Отмена</button>
        <span id="save-hint" class="muted"></span>
      </div>
    </div>
  </section>

  <section id="graph-pane">
    <div class="graph-head">
      <span>Граф связей</span>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="show-ghosts" checked> пустые</label>
      <button id="graph-reset" class="btn small">Сброс</button>
    </div>
    <canvas id="graph"></canvas>
    <div id="graph-tip" class="tip hidden"></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
